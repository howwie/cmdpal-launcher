# Runs the tests on every push and pull request. On pushes to main, also builds the x64 and ARM64
# packages and publishes them as a GitHub release, versioned 0.1.<run number>.
# Pushes that only change documentation don't run at all, so they don't publish a release.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel a release that's halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The runner has the Windows SDK, which would switch on MSIX packaging; the tests don't need it.
      - name: Test
        run: dotnet test -p:EnableMsixTooling=false

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes list the commits since the previous release tag, which needs history and tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build packages
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            $name = "CmdPalLauncher-$env:VERSION-$($platform.ToLowerInvariant())"
            $folder = "artifacts/$name"
            ./build/Build-Package.ps1 -Configuration Release -Platform $platform -Version $env:VERSION -OutputDir "$folder/app"
            Copy-Item build/install.ps1, LICENSE $folder
            Compress-Archive -Path "$folder/*" -DestinationPath "artifacts/$name.zip"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commits since the previous release, then install steps. --generate-notes adds the
          # "Full Changelog" link (and any merged pull requests) after them.
          ./build/Release-Notes.ps1 -Version $env:VERSION | Set-Content artifacts/notes.md -Encoding utf8
          gh release create "v$env:VERSION" artifacts/*.zip --title "v$env:VERSION" --target "$env:GITHUB_SHA" --notes-file artifacts/notes.md --generate-notes
